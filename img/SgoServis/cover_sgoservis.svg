<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d13" />
      <stop offset="50%" stop-color="#121622" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>

    <!-- Brand Accent Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c2233" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#131722" stop-opacity="0.95" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="#ffffff" fill-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <rect width="800" height="450" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="140" fill="#3b82f6" fill-opacity="0.12" filter="url(#glow)" />
  <circle cx="680" cy="380" r="160" fill="#10b981" fill-opacity="0.10" filter="url(#glow)" />

  <!-- Top Status Badge -->
  <g transform="translate(40, 35)">
    <rect width="185" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">EN DESARROLLO ACTIVO</text>
  </g>

  <!-- Top Right Version Badge -->
  <g transform="translate(620, 35)">
    <rect width="140" height="28" rx="14" fill="#0f172a" stroke="#2563eb" stroke-width="1" stroke-opacity="0.4" />
    <text x="70" y="18" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">JAVA 25 · SPRING 3+</text>
  </g>

  <!-- Main Title & Branding -->
  <g transform="translate(40, 110)">
    <!-- Brand Icon -->
    <rect width="44" height="44" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <path d="M 16 28 L 22 16 L 28 28 Z M 22 23 L 26 23" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="32" cy="14" r="3" fill="#10b981" />

    <!-- Project Title -->
    <text x="56" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">
      SgoServis
    </text>
    <text x="200" y="28" fill="url(#brandGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">
      : Red de Servicios Técnicos
    </text>
    
    <!-- Subtitle -->
    <text x="2" y="54" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">
      Plataforma de conexión directa entre clientes y prestadores de oficios certificados en Santiago y La Banda.
    </text>
  </g>

  <!-- Feature Cards Grid (2x2) -->
  <g transform="translate(40, 185)">
    <!-- Feature 1: Matrículas -->
    <g transform="translate(0, 0)">
      <rect width="345" height="78" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
      <rect x="14" y="15" width="34" height="34" rx="6" fill="#1e293b" />
      <text x="31" y="38" fill="#38bdf8" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">🛡️</text>
      <text x="58" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Validación de Matrículas</text>
      <text x="58" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Control obligatorio para gasistas y técnicos oficiales.</text>
    </g>

    <!-- Feature 2: Contacto WhatsApp -->
    <g transform="translate(375, 0)">
      <rect width="345" height="78" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
      <rect x="14" y="15" width="34" height="34" rx="6" fill="#1e293b" />
      <text x="31" y="38" fill="#10b981" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">💬</text>
      <text x="58" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Contacto Directo sin Fricción</text>
      <text x="58" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Enlace ágil vía WhatsApp auditado por métricas.</text>
    </g>

    <!-- Feature 3: Reputación y Puntualidad -->
    <g transform="translate(0, 92)">
      <rect width="345" height="78" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
      <rect x="14" y="15" width="34" height="34" rx="6" fill="#1e293b" />
      <text x="31" y="38" fill="#fbbf24" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">⭐</text>
      <text x="58" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Reputación y Puntualidad</text>
      <text x="58" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Calificaciones reales sobre calidad, tiempo y resolución.</text>
    </g>

    <!-- Feature 4: Cobertura y Geolocalización -->
    <g transform="translate(375, 92)">
      <rect width="345" height="78" rx="8" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1" />
      <rect x="14" y="15" width="34" height="34" rx="6" fill="#1e293b" />
      <text x="31" y="38" fill="#a855f7" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">📍</text>
      <text x="58" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Zonas de Cobertura con Leaflet</text>
      <text x="58" y="48" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Filtro de prestadores cercanos por barrio y radio.</text>
    </g>
  </g>

  <!-- Bottom Tech Stack Pills -->
  <g transform="translate(40, 395)">
    <!-- Pill 1: Monolito Modular -->
    <rect x="0" y="0" width="135" height="24" rx="12" fill="#1e1e2e" stroke="#4338ca" stroke-width="1" />
    <text x="67" y="16" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Monolito Modular</text>

    <!-- Pill 2: Spring Security -->
    <rect x="145" y="0" width="130" height="24" rx="12" fill="#1e1e2e" stroke="#2563eb" stroke-width="1" />
    <text x="210" y="16" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">JWT + Google OAuth2</text>

    <!-- Pill 3: MySQL -->
    <rect x="285" y="0" width="105" height="24" rx="12" fill="#1e1e2e" stroke="#0891b2" stroke-width="1" />
    <text x="337" y="16" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">MySQL JPA</text>

    <!-- Pill 4: Angular 22 -->
    <rect x="400" y="0" width="125" height="24" rx="12" fill="#1e1e2e" stroke="#dc2626" stroke-width="1" />
    <text x="462" y="16" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Angular 22 + Tailwind</text>

    <!-- Pill 5: Leaflet -->
    <rect x="535" y="0" width="105" height="24" rx="12" fill="#1e1e2e" stroke="#16a34a" stroke-width="1" />
    <text x="587" y="16" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Leaflet Maps</text>

    <text x="720" y="16" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-style="italic" text-anchor="end">Próximamente 🚀</text>
  </g>
</svg>
